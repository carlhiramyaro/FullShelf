spring.application.name=backend

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/fullshelf}
spring.datasource.username=${DATABASE_USERNAME:fullshelf}
spring.datasource.password=${DATABASE_PASSWORD:changeme}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# Clerk JWKS endpoint for verifying owner session tokens (Clerk dashboard ->
# API Keys -> Show JWKS URL). Never fetched at startup, only on first token
# verification, so an unset/placeholder value is harmless until an owner
# actually signs in.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${CLERK_JWKS_URI:https://REPLACE_WITH_CLERK_DOMAIN.clerk.accounts.dev/.well-known/jwks.json}

# Clerk user id (the `sub` claim) of the one permanent owner account, set
# per-environment. See OwnerBootstrapRunner.
app.owner-clerk-user-id=${OWNER_CLERK_USER_ID:}

# Origin of the shop kiosk browser (Next.js), allowed to call /api/staff/**
# and /api/devices/** directly via CORS. See CorsConfig.
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:3000}
